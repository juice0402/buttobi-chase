<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ぶっとびチェイス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
@@include css/screens.css@@
@@include css/sheets-sizes-motion.css@@
</style>

<canvas id="game" aria-label="ゲーム画面"></canvas>
<div id="safeProbe"></div>

<div id="hud" hidden>
  <div id="danger"></div>
  <div id="nitroFx"></div>
  <div id="flash"></div>
  <div class="hud-row">
    <div id="boostBar">
      <div class="bb-wrap">
        <div class="bb-label"><span>ニトロ</span><em id="bbHint">すれすれ・逆走・ぶつけてたまる</em></div>
        <div class="bb"><i id="bbFill"></i></div>
      </div>
    </div>
    <button type="button" class="pausebtn" id="pauseBtn" aria-label="一時停止"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
  </div>
  <div class="prog" id="progBar" aria-hidden="true"><i id="hProg"></i></div>
  <div class="bossbar" id="bossBar" hidden>
    <div class="bl"><b id="bossName">装甲車ボス</b><em id="bossLeft"></em></div>
    <div class="bhp"><i id="bossHp"></i></div>
  </div>
  <div class="combo" id="combo" hidden></div>
</div>
<div id="banner" aria-live="polite"></div>
<div id="toast" aria-live="polite"></div>

<section id="tut" hidden aria-label="あそびかた">
  <div class="tut-card" role="dialog" aria-label="あそびかた">
    <div class="tut-top"><span id="tutNo">1 / 3</span><button type="button" class="tut-skip" id="tutSkip">スキップ</button></div>
    <svg class="tut-pic" id="tutPic" viewBox="0 0 240 150" role="img" aria-label=""></svg>
    <h2 id="tutHead"></h2>
    <p id="tutText"></p>
    <div class="tut-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <button type="button" class="tut-next" id="tutNext">つぎへ</button>
  </div>
</section>

<div id="steerHint" hidden aria-hidden="true">
  <div class="sh-track"><i class="sh-arrow l"></i><i class="sh-arrow r"></i><svg class="sh-finger" viewBox="0 0 36 44"><circle class="rip" cx="18" cy="7" r="9"></circle><rect x="13" y="1.5" width="10" height="26" rx="5"></rect><rect x="6" y="19" width="24" height="23" rx="9"></rect></svg></div>
  <span class="sh-label">なぞって運転</span>
</div>

<div id="title" hidden role="button" tabindex="0" aria-label="ぶっとびチェイス　タップでスタート">
  <h1 class="logo"><span class="a">ぶっとび</span><span class="b">チェイス</span></h1>
  <p class="ver">ver 1.5</p>
  <p class="tap">タップでスタート</p>
</div>

<section id="result" hidden aria-label="けっか">
  <div class="r-in">
    <div class="r-main">
      <p class="res-town" id="rTown"></p>
      <p class="res-kind" id="rKind"></p>
      <b class="res-rank" id="rRank"></b>
      <p class="res-title" id="rTitle"></p>
      <p class="res-score"><span>スコア</span><b id="rScore">0</b><em class="new" id="rHi" hidden>ハイスコア</em></p>
      <p class="res-next" id="rNext"></p>
    </div>
    <div class="r-side">
      <ul class="r-gain" id="rGain"></ul>
      <div class="res-btns wait" id="rBtns">
        <button type="button" class="again" id="again">もう1回</button>
        <button type="button" class="to-g" id="toGarage">ガレージ<small><b id="rMoney">0</b>コイン</small></button>
      </div>
    </div>
  </div>
</section>

<section id="garage" hidden aria-label="ガレージ">
  <div class="g-in">
    <header class="g-head">
      <h2>ガレージ</h2>
      <div class="coins"><b id="gMoney">0</b><small>コイン</small></div>
      <button type="button" class="iconbtn" id="openRank" aria-label="ランキング" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1.5a3.5 3.5 0 0 0 3.6 3.4M17 6h3v1.5a3.5 3.5 0 0 1-3.6 3.4"/><path d="M12 14v3.5M8 20.5h8M9.5 17.5h5v3h-5z"/></svg></button>
      <button type="button" class="iconbtn" id="openSet" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button>
    </header>
    <div class="tabs" role="tablist" id="gTabs">
      <button type="button" role="tab" data-tab="car" aria-selected="true">車</button>
      <button type="button" role="tab" data-tab="up" aria-selected="false">強化</button>
      <button type="button" role="tab" data-tab="mis" aria-selected="false">ミッション</button>
      <button type="button" role="tab" data-tab="title" aria-selected="false">称号</button>
    </div>
    <section class="hero" id="hero" aria-live="polite"></section>
    <div class="panel" id="gPanel"></div>
    <footer class="g-foot">
      <div class="town" id="town">
        <button type="button" id="townPrev" aria-label="前の街">‹</button>
        <div><small id="townNo"></small><b id="townName"></b><span class="tstars" id="townStars"></span></div>
        <button type="button" id="townNext" aria-label="次の街">›</button>
      </div>
      <button type="button" class="go" id="go">しゅっぱつ</button>
    </footer>
  </div>
</section>

<div class="ov" id="setOv" hidden>
  <div class="sheet" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <div class="row">効果音<button type="button" class="sw" id="swSe" aria-pressed="true">オン</button></div>
    <div class="row">BGM<button type="button" class="sw" id="swBgm" aria-pressed="true">オン</button></div>
    <button type="button" class="sub" id="openTut">あそびかた</button>
    <button type="button" class="danger" id="wipe">データを消す</button>
    <div class="confirm" id="wipeAsk" hidden><p>データを全部消す。元にもどせない</p>
      <div><button type="button" class="yes" id="wipeYes">消す</button><button type="button" class="no" id="wipeNo">やめる</button></div>
    </div>
    <button type="button" class="sub" id="closeSet">とじる</button>
  </div>
</div>

<div class="ov" id="pauseOv" hidden>
  <div class="sheet" role="dialog" aria-label="一時停止">
    <h2>一時停止</h2>
    <button type="button" class="go" id="resume">つづける</button>
    <button type="button" class="sub" id="retry">やりなおす</button>
    <button type="button" class="sub" id="quit">ガレージへ</button>
    <div class="row">効果音<button type="button" class="sw" id="pSe" aria-pressed="true">オン</button></div>
    <div class="row">BGM<button type="button" class="sw" id="pBgm" aria-pressed="true">オン</button></div>
    <p class="ov-note">やめても、ここまでのコインはもらえる</p>
  </div>
</div>

<script>
/* ---------- BGM and sound effects: all made in code (Web Audio), no sound files ---------- */
@@include sound/1-tools.js@@
@@include sound/2-songs.js@@
@@include sound/3-effects.js@@
@@include sound/4-loops-api.js@@

</script>
<script>
@@include js/01-data-save.js@@
@@include js/02-state-road.js@@
@@include js/03-crash-effects.js@@
@@include js/04-ai.js@@
@@include js/05-update.js@@
@@include js/06-draw-cars.js@@
@@include js/07-draw-ground.js@@
@@include js/08-hud-garage.js@@
@@include js/09-result-title.js@@
@@include js/10-input-boot.js@@
</script>

</body></html>
</body>
</html>
