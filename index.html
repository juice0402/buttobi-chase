<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ぶっとびチェイス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: the road fills the phone at a fixed zoom; the logo stamps on and the run starts at once; a big rank stamp ends each run; the toy-catalogue shop sheet slides up only when asked for. Single deliberate look (toy box), no dark variant. */
:root{
  --navy:#17324d;
  --tomato:#ff5a36;
  --tomato-deep:#c8401f;
  --sun:#ffc83d;
  --sun-deep:#d9a21f;
  --mint:#38c79a;
  --mint-deep:#1f9e76;
  --sky:#7fd3ff;
  --paper:#f3f7fa;
  --line:#d3dee8;
  --mute:#5a6f85;
  --on-dark:#ffffff;
  --hud-bg:rgba(23,50,77,.84);
  --track:rgba(255,255,255,.22);
  --veil:rgba(10,20,30,.35);
  --shade:rgba(10,22,36,.68);
  --drop:rgba(0,0,0,.3);
  --card:#ffffff;
  --road:#4f5d6e;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html,body{touch-action:manipulation}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;overflow:hidden;background:var(--navy);color:var(--navy);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#safeProbe{position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prog{position:relative;height:5px;border-radius:3px;background:var(--hud-bg);margin:6px auto 0;max-width:520px;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sun);border-radius:4px}
.prog em{position:absolute;top:0;bottom:0;width:2px;background:var(--on-dark);opacity:.55}
.bossbar{max-width:520px;margin:6px auto 0;background:var(--hud-bg);border-radius:10px;padding:5px 8px 6px;color:var(--on-dark)}
.bossbar .bl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;font-weight:700}
.bossbar .bl b{font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.04em;color:var(--sun)}
.bossbar .bl em{font-style:normal;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.bhp{height:9px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:4px}
.bhp i{display:block;height:100%;width:100%;background:var(--tomato);border-radius:5px;transition:width .15s}
.combo{max-width:520px;margin:8px auto 0;text-align:right;font-family:var(--display);font-size:22px;color:var(--sun);text-shadow:0 2px 0 var(--navy),0 0 10px var(--veil)}
#boostBar{max-width:520px;margin:0 auto}
.hud-row{max-width:560px;margin:0 auto;display:flex;align-items:stretch;gap:8px}
.hud-row #boostBar{flex:1;min-width:0;max-width:none;margin:0}
.pausebtn{flex:none;width:52px;border:0;border-radius:14px;background:var(--hud-bg);color:var(--on-dark);display:grid;place-items:center;padding:0;pointer-events:auto;cursor:pointer}
.pausebtn svg{width:22px;height:22px;fill:currentColor}
.bb-wrap{background:var(--hud-bg);border-radius:14px;padding:8px 12px 10px;color:var(--on-dark)}
.bb-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;font-weight:700}
.bb-label span{flex:none;white-space:nowrap;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em}
.bb-label em{font-style:normal;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bb{height:18px;border-radius:9px;background:var(--track);overflow:hidden;margin-top:6px;position:relative}
.bb i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--tomato);border-radius:9px;transition:width .08s linear}
#boostBar.ready .bb-wrap{animation:readyPulse .7s ease-in-out infinite alternate}
#boostBar.ready .bb-label span,#boostBar.ready .bb-label em{color:var(--sun)}
#boostBar.ready .bb i,#boostBar.on .bb i{background:repeating-linear-gradient(-45deg,var(--tomato) 0 10px,var(--sun) 10px 20px);background-size:28px 28px;animation:stripe .6s linear infinite}
#boostBar.on .bb i{background-image:repeating-linear-gradient(-45deg,#ffffff 0 10px,var(--sun) 10px 20px);animation-duration:.22s}
#boostBar.on .bb-wrap{box-shadow:0 0 0 3px var(--sun),0 0 30px var(--tomato)}
#boostBar.on .bb-label span,#boostBar.on .bb-label em{color:#ffffff}
#boostBar.nope .bb-wrap{animation:nope .3s}
#boostBar.cool .bb{box-shadow:inset 0 0 0 2px var(--sky)}
#boostBar.cool .bb i{background:var(--sky);opacity:.45;transition:none}
#boostBar.cool .bb-label span,#boostBar.cool .bb-label em{color:var(--sky)}
@keyframes readyPulse{from{box-shadow:0 0 0 2px var(--tomato),0 0 6px var(--tomato);transform:scale(1)}to{box-shadow:0 0 0 4px var(--sun),0 0 28px var(--tomato);transform:scale(1.025)}}
@keyframes stripe{to{background-position:28px 0}}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#nitroFx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at center,rgba(255,138,61,0) 44%,rgba(255,138,61,.45) 78%,rgba(255,60,30,.7) 100%)}
#nitroFx.on{opacity:1;animation:nitroPulse .35s ease-in-out infinite alternate}
@keyframes nitroPulse{from{opacity:.6}to{opacity:1}}
#flash{position:fixed;inset:0;pointer-events:none;background:#ffd9a8;opacity:0}
#flash.go{animation:flashGo .45s ease-out}
@keyframes flashGo{0%{opacity:.7}100%{opacity:0}}
#danger{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;background:radial-gradient(ellipse at center,rgba(255,45,45,0) 44%,rgba(255,45,45,.75) 100%)}
#banner{position:fixed;left:0;right:0;top:max(28%,calc(env(safe-area-inset-top,0px) + 224px));text-align:center;font-family:var(--display);font-size:44px;color:var(--on-dark);text-shadow:0 3px 0 var(--navy),0 0 16px var(--veil);opacity:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.06)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#toast{z-index:60;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);background:var(--tomato);color:var(--on-dark);font-family:var(--display);font-size:15px;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .25s;max-width:calc(100vw - 32px);width:max-content;text-align:center;line-height:1.35;pointer-events:none}
#toast.show{opacity:1}
body.bossing #toast{top:calc(env(safe-area-inset-top,0px) + 146px)}
/* in the garage the toast sits just above the town picker (placed by toast()), so it never covers the tabs */
#toast.low{top:auto}
/* while the combo counter shows, the toast drops below it instead of sharing its row */
body:has(#combo:not([hidden])) #toast:not(.low){top:calc(env(safe-area-inset-top,0px) + 132px)}
body.bossing:has(#combo:not([hidden])) #toast:not(.low){top:calc(env(safe-area-inset-top,0px) + 182px)}

/* Title: the logo stamps onto the road, then the run starts by itself */
#title{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;background:radial-gradient(ellipse at center,rgba(10,20,30,.2) 0%,rgba(10,20,30,.62) 100%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));cursor:pointer;touch-action:none;outline:none}
.logo{margin:0;font-family:var(--display);font-weight:400;line-height:1;text-align:center;font-size:clamp(54px,17vw,104px);transform:rotate(-5deg);text-shadow:3px 0 0 var(--navy),-3px 0 0 var(--navy),0 3px 0 var(--navy),0 -3px 0 var(--navy),3px 3px 0 var(--navy),-3px 3px 0 var(--navy),3px -3px 0 var(--navy),-3px -3px 0 var(--navy),0 10px 0 var(--navy)}
.logo span{display:block}
.logo .a{color:var(--tomato);animation:inL .5s cubic-bezier(.2,1.5,.4,1) both}
.logo .b{color:var(--sun);animation:inR .5s cubic-bezier(.2,1.5,.4,1) .12s both}
@keyframes inL{from{transform:translateX(-120vw) skewX(-20deg)}to{transform:none}}
@keyframes inR{from{transform:translateX(120vw) skewX(-20deg)}to{transform:none}}
.ver{margin:0;font-family:var(--display);font-size:14px;letter-spacing:.14em;color:var(--navy);background:var(--on-dark);border-radius:999px;padding:3px 12px;animation:fadeUp .4s .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#title .tap{margin:8px 0 0;font-family:var(--display);font-size:20px;line-height:1;color:var(--navy);background:var(--sun);border:3px solid var(--navy);border-radius:999px;padding:14px 30px;box-shadow:0 5px 0 var(--navy);animation:fxTapIn .45s cubic-bezier(.2,1.5,.4,1) .75s both}
@keyframes fxTapIn{from{opacity:0;transform:scale(.5) rotate(-6deg)}to{opacity:1;transform:none}}
@media (min-width:700px) and (min-height:700px){#title .tap{font-size:26px;padding:18px 40px}}
#title.out{animation:titleOut .3s ease-in forwards}
@keyframes titleOut{to{opacity:0;transform:scale(1.25)}}

/* First seconds of a run: a finger swiping left and right */
#steerHint{position:fixed;left:0;right:0;top:75%;display:grid;justify-items:center;gap:4px;pointer-events:none;transition:opacity .3s}
#steerHint.gone{opacity:0}
.sh-track{position:relative;width:190px;height:52px}
.sh-track::before{content:"";position:absolute;left:16px;right:16px;top:10px;border-top:3px dashed var(--on-dark);opacity:.75}
.sh-arrow{position:absolute;top:2px;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent}
.sh-arrow.l{left:0;border-right:14px solid var(--on-dark)}
.sh-arrow.r{right:0;border-left:14px solid var(--on-dark)}
.sh-finger{position:absolute;left:50%;top:0;width:36px;height:44px;margin-left:-18px;overflow:visible;animation:swipe 1.3s ease-in-out infinite}
.sh-finger rect{fill:var(--on-dark);stroke:var(--navy);stroke-width:2.5}
.sh-finger .rip{fill:none;stroke:var(--sun);stroke-width:3;transform-origin:18px 7px;animation:rip 1.3s ease-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-62px)}50%{transform:translateX(62px)}}
@keyframes rip{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.sh-label{font-family:var(--display);font-size:15px;color:var(--on-dark);text-shadow:0 2px 0 var(--navy),0 0 8px var(--veil)}

/* Result: stamp, title and score up top; what you earned and two big buttons at the bottom, in thumb reach. The buttons wait 0.8 s so a nitro tap can't hit them */
#result{position:fixed;inset:0;display:flex;flex-direction:column;color:var(--on-dark);background:var(--shade);overflow-y:auto;padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r-in{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.r-main{flex:1 0 auto;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center}
.res-town{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.9}
.res-kind{margin:0;font-family:var(--display);font-size:24px;letter-spacing:.06em;text-shadow:0 3px 0 var(--navy)}
#result.clear .res-kind{color:var(--mint)}
#result.wreck .res-kind{color:var(--tomato)}
#result .res-rank{display:grid;place-items:center;width:124px;height:124px;border-radius:26px;margin:4px 0 8px;font-family:var(--display);font-weight:400;font-size:96px;line-height:1;box-shadow:0 8px 0 var(--drop);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) .15s both}
@keyframes stamp{from{transform:scale(2.6) rotate(-14deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}
.res-title{margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;font-family:var(--display);font-size:clamp(22px,7vw,30px);line-height:1.2;color:var(--sun);text-shadow:0 3px 0 var(--navy)}
.res-score{margin:4px 0 0;display:grid;justify-items:center;gap:2px}
.res-score span{font-size:12px;font-weight:700;letter-spacing:.14em;opacity:.85}
.res-score b{font-family:var(--display);font-weight:400;font-size:clamp(38px,12vw,52px);line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 var(--navy)}
.res-next{margin:0;font-size:13px;font-weight:700;opacity:.9}
/* the earned list is the only part that gives up height (and scrolls), so the two buttons always stay on screen */
.r-side{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.r-gain{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;list-style:none;margin:0;padding:10px 12px;display:grid;align-content:start;gap:7px;background:rgba(255,255,255,.12);border-radius:14px}
.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),rgba(0,0,0,.08));mask-image:linear-gradient(#000 calc(100% - 26px),rgba(0,0,0,.08))}
.panel.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 48px),transparent);mask-image:linear-gradient(#000 calc(100% - 48px),transparent)}
.r-gain:empty{display:none}
.r-gain li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;line-height:1.3}
.r-gain li i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-family:var(--display);background:var(--mint);color:var(--on-dark)}
.r-gain li.star i,.r-gain li.gold i,.r-gain li.title i{background:var(--sun);color:var(--navy)}
.r-gain li.open i{background:var(--sky);color:var(--navy)}
.r-gain li em{margin-left:auto;font-style:normal;font-family:var(--display);font-size:15px;color:var(--sun);white-space:nowrap}
.res-btns{flex:none;display:grid;gap:12px;transition:opacity .3s,transform .3s}
.res-btns.wait{opacity:0;transform:translateX(24px);pointer-events:none}
.again{display:block;width:100%;min-height:60px;border:0;border-radius:16px;padding:0 16px;font-family:var(--display);font-size:26px;background:var(--tomato);color:var(--on-dark);box-shadow:0 5px 0 var(--tomato-deep);cursor:pointer}
.to-g{display:flex;justify-content:center;align-items:center;gap:10px;min-height:60px;border:0;border-radius:16px;padding:0 13px;font-family:var(--display);font-size:20px;background:var(--sun);color:var(--navy);box-shadow:0 5px 0 var(--sun-deep);cursor:pointer}
.to-g small{font-family:var(--body);font-weight:900;font-size:12px}
.to-g small b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--tomato-deep);margin-right:2px}
.again:active,.to-g:active{transform:translateY(3px);box-shadow:none}
.rank-S{background:var(--sun);color:var(--navy)}
.rank-A{background:var(--tomato);color:var(--on-dark)}
.rank-B{background:var(--mint);color:var(--on-dark)}
.rank-C{background:var(--sky);color:var(--navy)}
.rank-D{background:var(--paper);color:var(--navy)}
.new{font-style:normal;font-family:var(--display);font-size:12px;text-shadow:none;background:var(--tomato);color:var(--on-dark);border-radius:999px;padding:3px 10px;animation:fxPop .32s cubic-bezier(.2,1.4,.4,1) .7s both}

/* Garage: coins and settings on top, four tabs, the picked car big, the 15-car grid under it (no sideways scrolling), the town picker and the start button at the bottom. Landscape: two columns */
#garage{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);color:var(--navy);padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.g-in{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.g-head{display:flex;align-items:center;gap:10px}
.g-head h2{margin:0;flex:1;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.coins{display:flex;align-items:baseline;gap:4px;background:var(--navy);color:var(--on-dark);border-radius:999px;padding:6px 14px}
.coins b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--sun);font-variant-numeric:tabular-nums}
.coins small{font-size:11px;font-weight:700}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;cursor:pointer}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:var(--navy);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--line);padding:4px;border-radius:14px}
.tabs button{min-height:44px;border:0;border-radius:10px;padding:7px 2px;font-family:var(--display);font-size:15px;white-space:nowrap;line-height:1.15;background:transparent;color:var(--mute);cursor:pointer;display:grid;justify-items:center;gap:1px;min-width:0}
.tabs button small{font-family:var(--body);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--navy);box-shadow:0 2px 0 var(--mute)}
.hero{display:grid;grid-template-columns:minmax(100px,36%) minmax(0,1fr);gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px}
.hero.st-riding{border-color:var(--navy);box-shadow:0 3px 0 var(--navy)}
.hero.st-buyable{border-color:var(--sun-deep);box-shadow:0 3px 0 var(--sun-deep)}
.hero.st-short,.hero.st-need{border-style:dashed}
.pic{min-height:150px;display:flex}
.hpic{display:block;width:100%;flex:1;min-height:150px;border-radius:12px;background:var(--road)}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
.info h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.15}
.hero.st-short h3,.hero.st-need h3{color:var(--mute);letter-spacing:.1em}
.meters{display:grid;gap:4px}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mute)}
.meter > span:first-child{width:3em}
.pips{display:flex;gap:3px}
.pips i{width:16px;height:8px;border-radius:4px;background:var(--line)}
.pips i.on{background:var(--tomato)}
.skill{margin:0;font-size:14px;font-weight:700;line-height:1.4}
.best{margin:0;font-size:12px;font-weight:700;color:var(--mute);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-height:20px}
.best b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--navy);font-variant-numeric:tabular-nums}
.rk{font-style:normal;font-family:var(--display);font-weight:400;font-size:12px;line-height:18px;border-radius:5px;padding:0 6px}
.gd{font-style:normal;font-family:var(--display);font-size:11px;line-height:18px;border-radius:5px;padding:0 5px;background:var(--sun);color:var(--navy);box-shadow:0 0 0 2px var(--sun-deep) inset}
.act{margin-top:auto;min-height:44px;border:0;border-radius:12px;padding:12px 10px;font-family:var(--display);font-size:17px;background:var(--line);color:var(--mute);cursor:pointer}
.act.ride{background:var(--mint);color:var(--on-dark);box-shadow:0 4px 0 var(--mint-deep)}
.act.buy{background:var(--sun);color:var(--navy);box-shadow:0 4px 0 var(--sun-deep)}
.act.now{background:transparent;border:2px solid var(--navy);color:var(--navy);cursor:default}
.act.need{font-family:var(--body);font-weight:900;font-size:13px;line-height:1.35}
.act:active:not(.now){transform:translateY(2px);box-shadow:none}
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:5px 5px 16px;margin:-3px -3px 0}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tile{position:relative;width:100%;display:grid;justify-items:center;gap:3px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:4px 3px 5px;cursor:pointer}
.tile canvas{display:block;width:100%;height:50px;border-radius:8px;background:var(--road)}
.tile span{font-size:11px;font-weight:900;line-height:1.2;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .gd{position:absolute;top:-6px;right:-4px}
.tile.st-riding{border-color:var(--navy);background:#dcecf8}
.tile.st-riding span{color:var(--navy)}
.tile.st-buyable{border-color:var(--sun-deep);background:#fff4d2}
.tile.st-buyable span{color:var(--tomato-deep)}
.tile.st-short,.tile.st-need{border-style:dashed;background:var(--paper)}
.tile.sel{outline:3px solid var(--tomato);outline-offset:1px}
.gnote{margin:0;text-align:center;font-size:12px;font-weight:700;color:var(--mute)}
.for{margin:0;font-size:13px;font-weight:700;color:var(--mute)}
.for b{font-family:var(--display);font-weight:400;color:var(--navy)}
.ups{list-style:none;margin:0;padding:0;display:grid;grid-auto-rows:1fr;gap:6px}
.up{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px}
.ic{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;color:var(--on-dark)}
.ic svg{width:26px;height:26px;fill:currentColor}
.ic.eng{background:var(--sun);color:var(--navy)}
.ic.body{background:var(--mint)}
.ic.boost{background:var(--tomato)}
.ic.ram{background:#4f8fc0}
/* the tuning bay (11/17): the car on a toy lift, the points as dots, ± per stat */
.bay{position:relative;height:118px;border-radius:14px;overflow:hidden;background:#2f3744;flex:none}
.bay canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bay .spk{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:2px;background:#ffd24a;pointer-events:none;animation:fxSpark .5s ease-out both}
@keyframes fxSpark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(160deg);opacity:0}}
.fxrattle{animation:fxRattle .46s steps(9,end) both}
@keyframes fxRattle{0%{transform:translate(0,0)}12%{transform:translate(-3px,1px) rotate(-1.2deg)}24%{transform:translate(3px,-1px) rotate(1deg)}36%{transform:translate(-2px,0) rotate(-.8deg)}48%{transform:translate(2px,1px) rotate(.6deg)}60%{transform:translate(-1px,-1px)}72%{transform:translate(1px,0)}100%{transform:none}}
.fxlift{animation:fxLift .4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fxLift{0%{transform:translateY(8px) scale(.97)}60%{transform:translateY(-3px)}100%{transform:none}}
.ptbar{display:flex;align-items:center;gap:8px;flex:none}
.pts{flex:1;display:flex;gap:5px;align-items:center;min-width:0}
.pts{gap:4px}
.pts i{width:14px;height:14px;border-radius:5px;border:2px dashed var(--line);flex:none}
.pts i.used{background:var(--navy);border:2px solid var(--navy)}
.pts i.free{background:var(--sun);border:2px solid #e0a92a;box-shadow:0 0 0 3px rgba(255,200,61,.3)}
.ptbar .act{margin:0;min-height:44px;font-size:14px;padding:0 12px;white-space:nowrap}
.ptbar .act b{font-size:16px;margin-left:4px}
.ptbar .respec{width:44px;padding:0;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);box-shadow:none;color:var(--navy)}
.ptbar .respec svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ptbar .respec:disabled{opacity:.35}
@media (min-width:700px){ .pts i{width:20px;height:20px;border-radius:6px} .pts{gap:6px} }
.up .pm{display:flex;gap:6px;flex:none}
.up .pm button{width:44px;height:44px;border-radius:12px;border:0;font-family:var(--display);font-size:22px;line-height:1;cursor:pointer;background:var(--sun);color:var(--navy);box-shadow:0 4px 0 #c9971f}
.up .pm button.sub{background:var(--card);border:2px solid var(--line);box-shadow:none}
.up .pm button:disabled{opacity:.35;box-shadow:none;cursor:default}
.up .pm button:active:not(:disabled){transform:translateY(2px);box-shadow:none}

.up-t{flex:1;min-width:0;display:grid;gap:5px}
.up-t b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1}
.up.full{border-color:var(--sun)}
.up-t small{font-size:12px;font-weight:700;color:var(--mute)}
.nw{white-space:nowrap}
.up .act{margin:0;flex:none;min-width:88px;font-size:15px}
.mis-sec{display:grid;gap:6px}
.stats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats li{min-width:0;display:grid;gap:2px;justify-items:center;align-content:center;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 4px}
.stats span{font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap}
.stats b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats b small{font-family:var(--body);font-weight:900;font-size:11px;margin-left:1px}
.mis-sec h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mis-sec h3 small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--mute)}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mlist li{min-height:50px;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 10px;font-size:14px;font-weight:900}
.mlist li i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;border:2px dashed var(--line)}
.mlist li em{margin-left:auto;font-style:normal;font-family:var(--display);font-size:14px;color:var(--tomato-deep);white-space:nowrap}
.mlist li.done{background:#e3f6ee;border-color:var(--mint)}
.mlist li.done i{background:var(--mint);border:0;color:var(--on-dark)}
.mlist li.done em{color:var(--mint-deep);font-family:var(--body);font-size:12px}
.mlist li.lock{opacity:.6}
.slist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slist li{display:grid;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.slist li b{font-family:var(--display);font-weight:400;font-size:14px}
.slist li span{font-family:var(--display);font-size:16px;letter-spacing:.08em;color:var(--sun-deep)}
.slist li small{font-size:11px;font-weight:700;color:var(--mute)}
.titles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:6px}
.ttl{min-width:0;display:grid;gap:3px;align-content:start;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:8px 5px}
.ttl b{font-family:var(--display);font-weight:400;font-size:13px;line-height:1.25;color:var(--mute)}
.ttl span{font-size:11px;line-height:1.35;color:var(--mute);text-wrap:balance}
.ph{display:inline-block}
.ttl.got{border:2px solid var(--navy);background:var(--card)}
.ttl.got b{color:var(--tomato)}
.g-foot{display:grid;gap:10px}
.town{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px}
.town button{height:48px;border:0;border-radius:10px;background:var(--paper);font-family:var(--display);font-size:22px;color:var(--navy);cursor:pointer}
.town div{text-align:center;display:grid;gap:1px;min-width:0}
.town small{font-size:11px;font-weight:700;color:var(--mute)}
.town b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.2}
.tstars{font-size:12px;font-weight:700;color:var(--mute)}
.tstars b{font-family:var(--display);font-weight:400;font-size:14px;color:var(--sun-deep);letter-spacing:.06em}
.town.locked b{color:var(--mute)}
.g-foot .go{max-width:none}
.go.locked{background:var(--line);color:var(--mute);box-shadow:0 5px 0 var(--mute);font-size:18px}
body.gt-up .hero,body.gt-mis .hero,body.gt-title .hero{display:none}

/* How to play: three picture cards before the very first run (and from settings) */
#tut{position:fixed;inset:0;z-index:45;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:var(--shade);padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tut-card{box-sizing:border-box;width:min(100%,400px);background:var(--paper);color:var(--navy);border-radius:22px;padding:16px;display:grid;gap:12px;text-align:center;box-shadow:0 8px 0 var(--drop)}
.tut-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;color:var(--mute)}
.tut-skip{border:0;background:none;font-family:var(--body);font-weight:900;font-size:14px;color:var(--mute);text-decoration:underline;min-height:44px;padding:0 4px;cursor:pointer}
.tut-pic{display:block;width:100%;height:auto;border-radius:16px;background:var(--road)}
.tut-card h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2}
.tut-card p{margin:0;font-size:15px;font-weight:700;line-height:1.55;text-wrap:balance}
.tut-dots{display:flex;justify-content:center;gap:8px}
.tut-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tut-dots i.on{background:var(--tomato);transform:scale(1.25)}
.tut-next{display:block;width:100%;min-height:52px;border:0;border-radius:16px;font-family:var(--display);font-size:22px;background:var(--tomato);color:var(--on-dark);box-shadow:0 5px 0 var(--tomato-deep);cursor:pointer}
.tut-next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tomato-deep)}
.tf{animation:tfSwipe 1.4s ease-in-out infinite}
@keyframes tfSwipe{0%,100%{transform:translateX(-46px)}50%{transform:translateX(46px)}}
.tc{animation:tcSwipe 1.4s ease-in-out infinite}
@keyframes tcSwipe{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
.tr{transform-origin:178px 112px;animation:tRip 1.1s ease-out infinite}
@keyframes tRip{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.tfl{transform-origin:120px 118px;animation:tFl .25s ease-in-out infinite alternate}
@keyframes tFl{to{transform:scaleY(1.25)}}
.tb{transform-origin:128px 62px;animation:tBurst .9s ease-in-out infinite alternate}
@keyframes tBurst{from{transform:scale(.85)}to{transform:scale(1.1)}}
@media (min-width:700px) and (min-height:700px){.tut-card{width:min(100%,564px);padding:22px;gap:16px}.tut-card h2{font-size:32px}.tut-card p{font-size:18px}.tut-next{font-size:26px;min-height:60px}}
@media (prefers-reduced-motion:reduce){.tf,.tc,.tr,.tfl,.tb{animation:none}}

/* Pause and settings sheets */
.ov{position:fixed;inset:0;z-index:40;background:var(--shade);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{box-sizing:border-box;justify-self:center;width:min(100%,380px);background:var(--paper);color:var(--navy);border-radius:20px;padding:16px;display:grid;gap:10px}
.sheet .go,.sheet .sub,.sheet .danger{min-height:56px;padding:0 13px;display:grid;place-items:center}
.sheet .go{font-size:22px}
.sheet h2{margin:0;text-align:center;font-family:var(--display);font-weight:400;font-size:24px}
.sub{border:0;border-radius:14px;padding:13px;font-family:var(--display);font-size:18px;background:var(--card);color:var(--navy);box-shadow:0 4px 0 var(--line);cursor:pointer}
.sub:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:2px solid var(--line);border-radius:14px;padding:4px 4px 4px 14px;font-weight:900}
.sw{min-height:44px;border:0;border-radius:999px;padding:8px 16px;font-family:var(--body);font-weight:900;font-size:14px;min-width:72px;background:var(--mint);color:var(--on-dark);cursor:pointer}
.sw[aria-pressed="false"]{background:var(--line);color:var(--mute)}
.danger{border:0;border-radius:14px;background:var(--card);color:var(--tomato-deep);font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--line);cursor:pointer}
.danger:active{transform:translateY(2px);box-shadow:none}
.confirm{display:grid;gap:8px;background:#ffe6df;border-radius:14px;padding:12px;text-align:center;font-weight:900;font-size:14px;color:var(--tomato-deep)}
.confirm p{margin:0;text-wrap:balance}
.confirm div{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm .yes{min-height:48px;border:0;border-radius:12px;padding:10px;background:var(--tomato);color:var(--on-dark);font-family:var(--display);cursor:pointer}
.confirm .no{min-height:48px;border:0;border-radius:12px;padding:10px;background:var(--card);color:var(--navy);font-family:var(--display);cursor:pointer}
.ov-note{margin:0;text-align:center;font-size:12px;font-weight:700;color:var(--mute)}
.go{display:block;width:100%;max-width:560px;margin:0 auto;font-family:var(--display);font-size:24px;border:0;border-radius:16px;padding:14px;background:var(--tomato);color:var(--on-dark);box-shadow:0 5px 0 var(--tomato-deep);cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tomato-deep)}

  for (let i = fx.length-1; i >= 0; i--){ const p = fx[i]; p.life -= dt; if (p.life <= 0){ fx.splice(i,1); continue; } p.x += p.vx*dt; p.y += p.vy*dt; const f = p.type === 'smoke' ? 0.99 : 0.96; p.vx *= f; p.vy *= f; p.rot += p.vr*dt;
    if (p.type === 'part'){ p.vz -= 520*dt; p.z += p.vz*dt; if (p.z < 0){ p.z = 0; if (p.vz < -45){ p.vz = -p.vz*0.42; p.vx *= 0.7; p.vy *= 0.7; p.vr *= 0.6; } else { p.vz = 0; p.vx *= 0.82; p.vy *= 0.82; p.vr *= 0.75; } } } }
  for (let i = pops.length-1; i >= 0; i--){ pops[i].life -= dt*1.1; if (pops[i].life <= 0) pops.splice(i,1); }
  shake = Math.max(0, shake - dt*18);
  if (P.slowT > 0) P.slowT -= dt;
  if (hurtT > 0) hurtT -= dt;
  for (const c of cars) if (c.slowT > 0) c.slowT -= dt;
  const playing = state === 'play';

  if (playing){
    // heat, combo, boost
    heatPts += dt * 1.8 * TOWN.heat * (undercover() ? 0.5 : 1);
    if (noticeT > 0){ noticeT -= dt; if (noticeT <= 0 && P.key === 'ppolice') popMe(P.x, P.y - 30, 'まぎれこんだ…', '#7fd3ff'); }
    // ambulance: the body mends itself bit by bit
    if (P.key === 'amb' && P.state === 'drive' && P.hp < P.maxHp){ P.hp = Math.min(P.maxHp, P.hp + P.maxHp * 0.011 * dt); healT -= dt; if (healT <= 0){ healT = 1.6; popMe(P.x + 14, P.y - 18, '＋', '#38c79a'); snd('heal'); } }
    const ns = Math.min(TOWN.cap, 1 + Math.floor(heatPts / 100));
    if (ns > star){ star = ns; maxStar = Math.max(maxStar, star); toast(`手配度 ★${star}`); snd('star'); sndDo(R => R.heat(star)); }
    if (comboT > 0){ comboT -= dt; if (comboT <= 0){ comboN = 0; $('combo').hidden = true; } }
    if (boosting){
      boost -= NITRO_DRAIN()*dt; if (boost <= 0){ boost = 0; boosting = false; coolT = OVERHEAT_T; sndDo(R => R.nitro(false)); }
      trailT -= dt; if (trailT <= 0){ trailT = 0.035; trail.unshift({x:P.x, y:P.y, a:P.a}); if (trail.length > 6) trail.pop(); }
      if (Math.random() < 0.6) burst(P.x + (Math.random() - 0.5)*P.w, P.y + P.h/2, 'spark', 1);
      if (Math.random() < 0.5 && fx.length < 280) fx.push({type:'boom', x:P.x + (Math.random() - 0.5)*P.w*0.6, y:P.y + P.h/2 + 6, vx:(Math.random() - 0.5)*30, vy:40 + Math.random()*40, life:0.35, max:0.35, size:3 + Math.random()*3, color:['#e3261b','#ff8a3d','#ffc83d'][(Math.random()*3)|0], rot:0, vr:0});
    } else if (trail.length) trail.pop();
    if (coolT > 0) coolT -= dt;
    // player control
    const L = laneInfo(dist), lim = L.half - P.w/2 - 1;
    if (keys.left) targetX -= 300*dt;
    if (keys.right) targetX += 300*dt;
    targetX = clamp(targetX, -lim, lim);
    if (drag) drag.tx = targetX - (drag.lastX - drag.x) * 1.3 / s;
    const slick = ice.length > 0 && onIce(P) && !boosting;
    if (slick && !onIceNow){ popMe(P.x, P.y - 24, 'つるつる！', '#7fd3ff'); snd('ice'); tip('ice', '凍った道！ すべるよ。追っ手をすべらせて かべにぶつけよう'); }
    onIceNow = slick;
    P.vy += clamp(-pSpeed() - P.vy, -380*dt*(slick ? 0.4 : 1), 380*dt*(slick ? 0.4 : 1));
    P.vx += clamp(clamp((targetX - P.x) * 9, -280, 280) - P.vx, -1500*dt*(slick ? 0.22 : 1), 1500*dt*(slick ? 0.22 : 1));
    P.a = clamp(P.vx / 700, -0.3, 0.3);
    wrongWay = L.nOn > 0 && P.x > -L.half + (L.n - L.nOn) * L.lw + 4;
    if (wrongWay) addBoost(10 * dt);
    // sitting in one lane gets you noticed: after CAMP_T s within half a lane, the police push harder until you move half a lane or more
    if (Math.abs(P.x - campX) > LANE * 0.5){ campX = P.x; campT = 0; camping = false; }  // any move of half a lane clears it (anchored where it started)
    else if ((campT += dt) >= CAMP_T && !camping){
      camping = true; campX = P.x; if (star >= 3 && pinchNext) pinchNext = Math.min(pinchNext, t + 2.5); // (before ★3 there is no pincer schedule to pull in)
      if (!undercover()){ popMe(P.x, P.y - 34, '目立ってる！', '#ff5a36'); snd('warn'); tip('camp', 'じっとしてると目立つ！ 車線を変えよう'); }
    }
    // pickup: tosses a drum off the bed when a chaser sits right behind
    if (P.key === 'pickup' && P.state === 'drive'){
      P.drumT -= dt;
      if (P.drumT <= 0 && cars.some(c => c.role === 'chaser' && c.state === 'drive' && c.plan !== 'gone' && c.y - P.y > P.h/2 + 10 && c.y - P.y < 210 && Math.abs(c.x - P.x) < 26 + c.w/2)){
        P.drumT = DRUM_EVERY;
        drums.push({x:P.x + (Math.random() - 0.5)*6, y:P.y + P.h/2 + 14, alive:true, own:true, t0:t});
        popMe(P.x, P.y + P.h/2 + 22, 'ポイッ！', '#38c79a'); burst(P.x, P.y + P.h/2 + 8, 'spark', 4); snd('drum');
      }
    }
    const hpR = P.hp / P.maxHp;
    if (hpR < 0.6){ P.smokeT -= dt; if (P.smokeT <= 0){ P.smokeT = hpR < 0.3 ? 0.04 : hpR < 0.45 ? 0.08 : 0.16; smoke(P.x + (Math.random() - 0.5)*P.w*0.4, P.y - P.h*0.2, hpR < 0.3 ? '#2f3238' : '#6b717b'); } }
    // spawns
    const a = AREAS[areaIdx];
    spawnAcc += Math.max(0, -P.vy) * dt;
    while (spawnAcc > a.gap){ spawnAcc -= a.gap; for (let i = 0; i < a.per; i++){ const y = worldTop() - 40 - Math.random()*40; if (!calmSkip(y)) spawnTraffic(y, Math.random() < a.oppRate); } }
    nextChaser -= dt;
    if (nextChaser <= 0){ spawnChaser(); nextChaser = HEAT[star-1].every * (heli ? 0.6 : 1) * (boss ? 1.8 : 1) * (camping ? 0.7 : 1) * (0.75 + Math.random()*0.5); }
    // intersections and level crossings
    const eR = camX + W/(2*s) + 40, eL = camX - W/(2*s) - 40;
    for (const q of isecs){
      if (q.y > worldBottom() + 40 || q.y < worldTop() - 260) continue;
      q.tl -= dt; q.tr -= dt;
      if (q.tl <= 0){ q.tl = 1.0 + Math.random()*1.0; spawnCross(q, -1, eR); }
      if (q.tr <= 0){ q.tr = 1.0 + Math.random()*1.0; spawnCross(q, 1, eL); }
    }
    for (const r of rails){
      if (r.state !== 'idle' || P.y < r.y || P.y - r.y > 300) continue;
      const eta = (P.y - r.y + 14 + P.h/2) / Math.max(60, -P.vy);
      r.fx = Math.min(P.x - TRAIN_V*(eta + 0.35), -(halfAt(-r.y/M) + 60));
      r.state = 'run'; toast('ふみきり！ 電車が来る！'); snd('railbell');
      r.hornAt = t + Math.max(0.2, eta - 0.3);
    }
    for (const r of rails) if (r.hornAt && t >= r.hornAt){ r.hornAt = 0; snd('train'); }
    for (const w of works) if (!w.seen && w.signY > worldTop() - 20){ w.seen = true; tip('works', 'この先 工事中！ 車線がへるよ。さくにパトカーをさそいこもう'); }
    // harbor cranes: a container comes down right after you pass under — lure the police below it
    for (const c of cranes){
      if (c.state === 'idle' && P.y > c.y && P.y - c.y < 330){
        const eta = (P.y - c.y + P.h/2 + 10) / Math.max(60, -P.vy), half = halfAt(-c.y / M);
        c.x = clamp(P.x, -half + c.w/2, half - c.w/2); c.state = 'warn'; c.at = t + eta + 0.45;
        tip('crane', 'コンテナが落ちてくる！ 追っ手を下にさそいこもう', 'コンテナに注意！'); snd('warn');
      }
      if (c.state === 'warn' && t >= c.at - 0.35) c.state = 'drop';
      if (c.state === 'drop' && t >= c.at){ c.state = 'done'; landContainer(c); }
    }
    if (HEAT[star-1].heli && !heli && t > heliCool){ heli = {x:P.x, y:worldBottom() + 80, life:14}; toast('ヘリが来た！'); snd('warn'); }
    // missions done in the middle of a run get a call-out (they are paid at the end)
    misCheckT -= dt; if (misCheckT <= 0){ misCheckT = 0.5; checkMis(false); }
    if (misQueue.length && t >= misT){ const m = misQueue.shift(); toast(`ミッション達成！ ${m}`, 1900); snd('mission'); misT = t + 2.1; }
    // chaser tactics
    if (!boss && nextBoss < BOSSES.length && dist >= BOSSES[nextBoss].from){ if (dist < BOSSES[nextBoss].to - 60) spawnBoss(nextBoss); else nextBoss++; }
    if (boss && dist >= BOSSES[boss.boss.i].to){ boss.boss.mode = 'leave'; toast(`${BOSSES[boss.boss.i].name || TOWN.boss.name}をふりきった！`); endBoss(); }
    if (star >= 2 && !boss){
      if (!spikeNext) spikeNext = Math.max(t + 4, 11);
      if (t >= spikeNext){ if (!undercover() && !cars.some(c => c.plan === 'spike' && c.state === 'drive')) startSpiker(); spikeNext = t + SPIKE_EVERY[star] + Math.random()*3; }
    }
    if (star >= 3 && !boss && halfAt(dist) >= 80){
      if (!pinchNext) pinchNext = Math.max(t + 5, 13);
      if (t >= pinchNext){ if (!undercover() && !cars.some(c => c.plan === 'pin' && c.state === 'drive')) spawnPincers(); pinchNext = t + (PINCH_EVERY[star] + Math.random()*4) * (camping ? 0.5 : 1); }
    }
  }
  if (heli){
    heli.life -= dt;
    const ty = heli.life > 0 ? P.y + 34 + Math.sin(t*1.3)*10 : P.y - 900;
    heli.y += (ty - heli.y) * Math.min(1, dt * (heli.life > 0 ? 1.2 : 0.7));
    heli.x += (P.x - heli.x) * Math.min(1, dt * 1.5);
    if (heli.life < 0 && heli.y < worldTop() - 100){ heli = null; heliCool = t + 12; }
  }

  // AI + physics
  for (const c of cars) if (c.state === 'drive'){ if (c.role === 'traffic'){ if (c.cross) driveCross(c, dt); else driveTraffic(c, dt); } else driveChaser(c, dt); }
  integrate(P, dt);
  for (const c of cars) integrate(c, dt);
  const all = [P, ...cars];
  all.sort((p, q) => p.y - q.y);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length && all[j].y - all[i].y < 90; j++) collide(all[i], all[j]);
  if (works.length) for (const b of all) if (!b.free && !b.fixed) workHit(b);

  // trains, drums, chained explosions
  for (const r of rails){
    if (r.state !== 'run') continue;
    r.fx += TRAIN_V * dt;
    if (r.fx - TRAIN_LEN > 1000){ r.state = 'done'; continue; }
    for (const b of [P, ...cars]){
      if (t - (b.trainT || -9) < 0.5) continue;
      const hx = b.cross ? b.h/2 : b.w/2, hy = b.cross ? b.w/2 : b.h/2;
      if (Math.abs(b.y - r.y) > 14 + hy || b.x + hx < r.fx - TRAIN_LEN || b.x - hx > r.fx) continue;
      if (b === P && boosting){ b.trainT = t; burst(b.x, b.y, 'spark', 8); continue; }
      b.trainT = t; b.vx += 520 + Math.random()*120; b.vy += (b.y < r.y ? -1 : 1) * 80;
      burst(b.x, b.y, 'spark', 10); shake = Math.max(shake, 6);
      if (b === P){ if (state === 'play'){ dmgSrc = 'train'; damage(45); popMe(P.x, P.y - 30, 'でんしゃ！', '#ffffff'); } }
      else { b.lastHit = 'player'; b.lastHitT = t; if (b.boss && b.state === 'drive'){ hurtBoss(b, 150); pop(b.x, b.y - 30, 'でんしゃドーン！', '#ffc83d'); } else if (b.state === 'drive') crash(b, 'train'); else b.av += 10; }
    }
  }
  const dTop = worldTop() - 60, dBot = worldBottom() + 60;
  for (const dr of drums){
    if (!dr.alive || dr.y < dTop || dr.y > dBot) continue;
    for (const b of [P, ...cars]){
      // drums tossed off the pickup bed go off under anyone (but not under you right after the toss)
      if (dr.own ? (b === P && t - dr.t0 < 1.5) || b.cross : !(b === P || b.role === 'chaser' || b.state === 'wreck' || (b.lastHit === 'player' && t - b.lastHitT < 2))) continue;
      if (Math.abs(b.x - dr.x) > b.h/2 + 8 || Math.abs(b.y - dr.y) > b.h/2 + 8) continue;
      const c = circlesOf(b); let hit = false;
      for (let i = 0; i < 6; i += 2) if (Math.hypot(c[i] - dr.x, c[i+1] - dr.y) < c[6] + 6) hit = true;
      if (hit){ dr.alive = false; pop(dr.x, dr.y, 'ドッカーン！', '#ffc83d'); ownBlast = !!dr.own; explodeAt(dr.x, dr.y, 60, 320, true, dr.own ? 4 : 12); ownBlast = false; break; }
    }
  }
  for (let i = booms.length - 1; i >= 0; i--) if (booms[i].at <= t){ const bm = booms.splice(i, 1)[0]; explodeAt(bm.x, bm.y, bm.R, bm.F, bm.credit, bm.dmg, bm.big); }
  // spike strips puncture anyone who drives over them, police included
  for (let i = spikes.length - 1; i >= 0; i--){
    const sp = spikes[i];
    if (sp.gone || sp.y > worldBottom() + 200){ spikes.splice(i, 1); continue; }
    for (const b of [P, ...cars]){
      if (b.state !== 'drive' || b.cross || sp.hit.has(b)) continue;
      if (Math.abs(b.y - sp.y) > b.h/2 + 4 || Math.abs(b.x - sp.x) > sp.w/2 + b.w/2 - 3) continue;
      if (b === P && boosting){ sp.gone = true; burst(sp.x, sp.y, 'spark', 14); pop(sp.x, sp.y, 'トゲをふみつぶした！', '#ffc83d'); break; }
      sp.hit.add(b); burst(b.x, sp.y, 'spark', 6);
      if (b === P){ if (state === 'play'){ P.slowT = Math.max(P.slowT, 2.2); damage(5); popMe(P.x, P.y - 26, 'パンク！', '#ffffff'); snd('spike'); } }
      else if (b.boss){ hurtBoss(b, 35); b.slowT = 1.6; }
      else if (b.plan !== 'gone'){ if (b.role === 'chaser'){ b.lastHit = 'player'; b.lastHitT = t; } crash(b, 'spike'); }
    }
    if (sp.gone) spikes.splice(i, 1);
  }

  // near misses, cleanup
  const wb = worldBottom(), wt = worldTop();
  for (let i = cars.length-1; i >= 0; i--){
    const c = cars[i], rel = c.y - P.y;
    if (playing && !c.cross && c.state === 'drive' && !c.nm && c.prevRel !== null && c.prevRel < 0 && rel >= 0){
      const gap = Math.abs(c.x - P.x) - (c.w + P.w)/2;
      const sports = P.key === 'sports';
      if (gap > 0 && gap < (sports ? 15 : 12)){ c.nm = true; nearN++; if (c.opp) nearOppN++; nearMoney += 5; snd('near'); addBoost((c.opp ? 16 : 9) * (sports ? 1.5 : 1)); popMe(P.x, P.y - 24, (c.opp ? 'すれすれ逆走！' : 'ニアミス！') + (sports ? ' ×1.5' : ''), '#7fd3ff'); if (sports) burst(P.x, P.y, 'spark', 3); }
    }
    c.prevRel = rel;
    const keep = c.role === 'chaser' && c.state === 'drive' && c.plan !== 'gone' && !(c.boss && c.boss.mode === 'leave');
    const offScreen = Math.abs(c.x - camX) > W/(2*s) + 20;
    if (!keep && (c.collected || c.y > wb + 300 || c.y < wt - 700 || (c.cross && Math.abs(c.x) > 560) || (c.cross && c.stall > 3 && offScreen))) cars.splice(i, 1);
  }

  camY = P.y;
  dist = Math.max(dist, -P.y / M);
  const half = halfAt(dist), camLim = Math.max(0, half + 30 - W/(2*s));
  camX += (clamp(P.x * 0.6, -camLim, camLim) - camX) * Math.min(1, dt*4);

  if (playing){
    const ai = areaIndexAt(dist); if (ai !== areaIdx){ areaIdx = ai; banner(AREAS[ai].name); }
    if (dist >= GOAL){ state = 'ending'; endKind = 'clear'; endT = 1.6; banner('にげきった！'); burst(P.x, P.y, 'spark', 30); boosting = false; nitroOff(); drag = null; snd('goal'); sndDo(R => { R.nitro(false); R.boss(false); R.siren(0); R.jingle('clear'); }); }
  } else if (state === 'ending'){
    if (endKind === 'clear'){ P.vy += clamp(-120 - P.vy, -200*dt, 200*dt); P.vx *= 0.9; }
    endT -= dt; if (endT <= 0) finishRun();
  }
}

/* ---------- drawing ---------- */

let glossG = null;
const NO_GLOSS = {bike:1, container:1};
function toyGloss(w, h){

  ctx.fillStyle = shade(col, -0.3); rr(-w/2, -h/2, w, h, r); ctx.fill();
  ctx.fillStyle = '#3a4049'; rr(-w*0.4, -h*0.44, w*0.8, h*0.88, r*0.7); ctx.fill();
  ctx.fillStyle = '#5c6470'; ctx.fillRect(-w*0.4, -h*0.31, w*0.8, 2); ctx.fillRect(-w*0.4, h*0.31 - 2, w*0.8, 2); ctx.fillRect(-1, -h*0.31, 2, h*0.62);
  for (const yy of [-h*0.31, h*0.31]) for (const sx of [-1, 1]){ const x = sx*(w/2 - ww/2); ctx.fillStyle = '#16191e'; rr(x - ww/2, yy - wh/2, ww, wh, ww*0.4); ctx.fill(); ctx.fillStyle = '#9aa3ad'; circle(x, yy, Math.min(ww, wh)*0.24); }
  ctx.fillStyle = '#c9ced6'; circle(0, 0, Math.max(1.6, w*0.08)); ctx.fillStyle = '#ffffff'; circle(-0.5, -0.5, Math.max(0.6, w*0.03));

/* flying parts and wooden blocks: a shadow on the ground, the piece lifted by its height */

    case 'cyl': ctx.fillStyle = p.color; circle(0, 0, z*0.55); ctx.fillStyle = 'rgba(255,255,255,0.35)'; circle(-z*0.15, -z*0.15, z*0.25); ctx.lineWidth = 1; ctx.strokeStyle = shade(p.color, -0.3); ctx.beginPath(); ctx.arc(0, 0, z*0.55, 0, Math.PI*2); ctx.stroke(); break;
    default: ctx.fillStyle = p.color; ctx.fillRect(-z/2, -z/2, z, z); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-z/2, -z/2, z, 1.6); ctx.fillRect(-z/2, -z/2, 1.6, z); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(-z/2, z/2 - 1.6, z, 1.6); ctx.fillRect(z/2 - 1.6, -z/2, 1.6, z);

function outline(c){ ctx.lineWidth = 1.2; ctx.strokeStyle = shade(c, -0.35); ctx.stroke(); }

/* the tuning bay picture: a toy garage (pegboard with tools, a tiled floor, hazard stripes, a lift) with the car on it, nose to the right */
function drawBay(cv, C){
  if (!cv) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1), w = cv.clientWidth || 300, h = cv.clientHeight || 118;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const main = ctx; ctx = cv.getContext('2d');
  try {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#3a4352'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; for (let x = 14; x < w; x += 28) ctx.fillRect(x, 22, 1, h);
    ctx.fillStyle = '#d9a86c'; ctx.fillRect(0, 0, w, 22); ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(0, 21, w, 2);
    ctx.fillStyle = 'rgba(90,55,25,0.35)'; for (let x = 6; x < w; x += 12) circle(x, 6, 1.1);
    const tool = (x, k) => { ctx.fillStyle = k ? '#c9ced6' : '#9aa3ad';
      if (k === 0){ rr(x - 2, 6, 4, 13, 2); ctx.fill(); circle(x, 6, 4); ctx.fillStyle = '#d9a86c'; circle(x, 4.5, 1.8); }       // wrench
      else if (k === 1){ ctx.fillStyle = '#a0522d'; rr(x - 1.5, 8, 3, 12, 1); ctx.fill(); ctx.fillStyle = '#9aa3ad'; rr(x - 6, 5, 12, 4, 1.5); ctx.fill(); }   // hammer
      else { ctx.fillStyle = '#e8735a'; rr(x - 2.5, 5, 5, 7, 2); ctx.fill(); ctx.fillStyle = '#c9ced6'; ctx.fillRect(x - 0.8, 12, 1.6, 8); } };   // screwdriver
    [0.1, 0.2, 0.8, 0.9].forEach((f, i) => tool(w * f, i % 3));
    for (let x = -10, i = 0; x < w + 10; x += 12, i++){ ctx.fillStyle = i % 2 ? '#20242c' : '#ffd24a'; ctx.beginPath(); ctx.moveTo(x, h); ctx.lineTo(x + 6, h - 8); ctx.lineTo(x + 18, h - 8); ctx.lineTo(x + 12, h); ctx.fill(); }

    ctx.fillStyle = '#5c6470'; rr(w/2 - C.h*k*0.42, cy - C.w*k*0.62, C.h*k*0.16, C.w*k*1.24, 3); ctx.fill(); rr(w/2 + C.h*k*0.26, cy - C.w*k*0.62, C.h*k*0.16, C.w*k*1.24, 3); ctx.fill();
    ctx.setTransform(dpr*k, 0, 0, dpr*k, dpr*w/2, dpr*cy); ctx.rotate(Math.PI / 2);

}

/* title hints wrap only between phrases (after a particle, before a number), so 「20台」 or 「追っ手」 never split */
function phrases(t){
  const ch = [...t], word = /[\u4e00-\u9fff\u30a0-\u30ff0-9]/, dig = /[0-9]/, hira = /[\u3041-\u309f]/;
  let out = '', cur = '';

  for (let i = 0; i < ch.length; i++){
    const c = ch[i], n = ch[i + 1] || '';

}

const TOY = (x, y, col, w, h) => `<g transform="translate(${x} ${y})"><rect x="${-w/2 + 3}" y="${-h/2 + 4}" width="${w}" height="${h}" rx="7" fill="rgba(0,0,0,.28)"/>` +

  `<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="7" fill="${col}" stroke="#17324d" stroke-width="2"/>` +
  `<rect x="${-w/2 + 4}" y="${-h/2 + 7}" width="${w - 8}" height="${h*0.18}" rx="3" fill="#bfe6ff"/><rect x="${-w/2 + 5}" y="${h/2 - h*0.26}" width="${w - 10}" height="${h*0.12}" rx="3" fill="#9cc9e6"/></g>`;
const ROAD = '<rect width="240" height="150" fill="#4f5d6e"/><rect x="0" width="22" height="150" fill="#a8c49a"/><rect x="218" width="22" height="150" fill="#a8c49a"/>' +
  '<g fill="#f2f4f0" opacity=".8"><rect x="118" y="4" width="4" height="22"/><rect x="118" y="44" width="4" height="22"/><rect x="118" y="84" width="4" height="22"/><rect x="118" y="124" width="4" height="22"/></g>';
const TUT = [
  {head:'なぞって運転', text:'画面のどこをなぞっても動く',
   pic: ROAD + `<g class="tc">${TOY(120, 62, '#ff5a36', 26, 44)}</g>` +
     '<path d="M70 124h100" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6" opacity=".8"/><path d="M62 124l12-8v16zM178 124l-12-8v16z" fill="#ffffff"/>' +
     '<g class="tf"><rect x="108" y="112" width="24" height="34" rx="11" fill="#ffffff" stroke="#17324d" stroke-width="3"/><circle cx="120" cy="114" r="10" fill="none" stroke="#ffc83d" stroke-width="3"/></g>'},
  {head:'満タンでタップ', text:'すれすれ・逆走・体当たりでたまる',
   pic: ROAD + '<rect x="30" y="12" width="180" height="26" rx="13" fill="#17324d"/><defs><pattern id="tst" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#ff5a36"/><rect x="7" width="7" height="14" fill="#ffc83d"/></pattern></defs>' +
     '<rect x="36" y="18" width="168" height="14" rx="7" fill="url(#tst)"/><text x="120" y="56" text-anchor="middle" font-size="13" font-weight="900" fill="#ffc83d" font-family="sans-serif">ニトロ満タン！</text>' +
     '<g class="tfl"><path d="M110 118q10 22 10 28q0-6 10-28z" fill="#ff8a3d"/><path d="M114 118q6 14 6 20q0-6 6-20z" fill="#ffc83d"/></g>' + TOY(120, 98, '#ff5a36', 26, 42) +
     '<circle class="tr" cx="178" cy="112" r="16" fill="none" stroke="#ffffff" stroke-width="4"/><circle cx="178" cy="112" r="6" fill="#ffffff"/>'},
  {head:'追っ手をクラッシュ', text:'かべや車にぶつけさせるとコイン',
   pic: ROAD + TOY(104, 70, '#9fb3c6', 26, 44) +
     '<g transform="rotate(-24 150 78)">' + TOY(150, 78, '#f7f7f4', 24, 42).replace('fill="#bfe6ff"', 'fill="#17324d"') + '<rect x="140" y="74" width="10" height="5" fill="#ff3b3b"/><rect x="150" y="74" width="10" height="5" fill="#3b8bff"/></g>' +
     '<g class="tb"><path d="M128 40l6 14 15-4-10 12 10 12-15-3-6 14-6-14-15 3 10-12-10-12 15 4z" fill="#ffc83d" stroke="#17324d" stroke-width="2"/></g>' +
     '<text x="190" y="40" text-anchor="middle" font-size="22" font-weight="900" fill="#ffc83d" stroke="#17324d" stroke-width="4" paint-order="stroke" font-family="sans-serif">+60</text>' +

];
let tutI = 0, tutThen = null, tutAt = 0;

  else { const go = !tutThen; endTut(); if (go) fxGo(); } });

/* title: the logo stamps on and waits for a tap (11/17 しょーくん「いきなりゲームが始まるとビビる」); the very first time, the picture cards come first */
let titleTimer = 0, titleGo = false;
function showTitle(){
  state = 'title'; titleGo = false;

}
function leaveTitle(){
  if (state !== 'title' || titleGo) return;

}

/* iOS: a quick second tap must not open the text loupe or zoom, a pinch must not zoom, a long press must not open a menu (11/17 しょーくん「ダブルタップしたら虫眼鏡」) */
{ let lastEnd = 0;
  document.addEventListener('touchend', e => { const now = performance.now(); if (now - lastEnd < 400 && e.cancelable && !e.target.closest('button, .panel, .r-gain')) e.preventDefault(); lastEnd = now; }, {passive:false});
  for (const ev of ['dblclick', 'gesturestart', 'gesturechange', 'contextmenu', 'selectstart']) document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, {passive:false});
}
$('title').addEventListener('pointerdown', e => { e.preventDefault(); leaveTitle(); });

/* ---------- input ---------- */
cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  if (drag && e.pointerId !== drag.id){ tryBoost(); return; }
  drag = {id:e.pointerId, x:e.clientX, lastX:e.clientX, tx:targetX, t0:performance.now(), moved:0};
  try { cvs.setPointerCapture(e.pointerId); } catch(err){}
});
cvs.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.lastX = e.clientX; drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x)); if (drag.moved > 24) steered = true;
  targetX = drag.tx + (e.clientX - drag.x) * 1.3 / s;
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (e.type === 'pointerup' && performance.now() - drag.t0 < 230 && drag.moved < 12) tryBoost();
  drag = null;
};
cvs.addEventListener('pointerup', endDrag); cvs.addEventListener('pointercancel', endDrag);
const keyOf = e => e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key;  // P / A / D work with Shift or Caps Lock too
window.addEventListener('keydown', e => {
  if (state === 'title'){ e.preventDefault(); leaveTitle(); return; }
  if (state === 'tut'){ if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); $('tutNext').click(); } return; }
  const k = keyOf(e);
  if (k === 'Escape' || k === 'p'){ if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); return; }
  if (k === 'ArrowLeft' || k === 'a'){ keys.left = true; steered = true; }
  if (k === 'ArrowRight' || k === 'd'){ keys.right = true; steered = true; }
  if (k === ' ' || k === 'ArrowUp'){ if (state === 'play'){ e.preventDefault(); tryBoost(); } }
});
window.addEventListener('keyup', e => {
  const k = keyOf(e);
  if (k === 'ArrowLeft' || k === 'a') keys.left = false;
  if (k === 'ArrowRight' || k === 'd') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; });  // a key let go in another window never sends keyup here
$('pauseBtn').addEventListener('click', () => { snd('tap'); pauseGame(); });
$('resume').addEventListener('click', () => { snd('tap'); resumeGame(); });
$('retry').addEventListener('click', () => { if (state !== 'pause') return; snd('tap'); $('pauseOv').hidden = true; finishRun(false); startRun(townI); fxGo(); });
$('quit').addEventListener('click', () => {
  if (state !== 'pause') return;
  snd('tap'); closeOv('pauseOv'); const before = save.money; finishRun(false); openGarage();
  const got = save.money - before; if (got > 0) toast(`ここまでのコイン +${fmt(got)}`);
});
$('again').addEventListener('click', () => { if (state !== 'result') return; snd('tap'); startRun(townI); fxGo(); });
$('gPanel').addEventListener('scroll', e => fadeMore(e.currentTarget), {passive:true});
if (window.ResizeObserver) new ResizeObserver(() => fadeMore($('gPanel'))).observe($('gPanel'));
$('rGain').addEventListener('scroll', e => fadeMore(e.currentTarget), {passive:true});
$('toGarage').addEventListener('click', () => { if (state !== 'result') return; snd('tap'); openGarage(); });
$('garage').addEventListener('click', e => {
  if (garageFresh()) return;
  const tab = e.target.closest('[data-tab]');
  if (tab){
    const order = ['car', 'up', 'mis', 'title'], was = gTab, heroWas = $('hero').dataset.i;
    gTab = tab.dataset.tab; if (gTab === 'car') gSel = save.car; $('gPanel').scrollTop = 0; snd('tap'); renderGarage();
    if (gTab !== was){ const dir = order.indexOf(gTab) > order.indexOf(was) ? 1 : -1;
      fxRestart(tab, 'fxpick'); fxIn($('gPanel'), dir); tilesIn($('gPanel'), '.tile, .ttl');
      if ($('hero').dataset.i !== heroWas) fxHero(dir); }
    return;
  }
  const tile = e.target.closest('.tile');
  if (tile){
    const was = gSel; gSel = +tile.dataset.i; snd('tap'); renderHero(); for (const b of $('gPanel').querySelectorAll('.tile')) b.classList.toggle('sel', +b.dataset.i === gSel);
    fxRestart(tile, 'fxpick'); if (gSel !== was) fxHero(gSel > was ? 1 : -1, true);
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, hi = +$('hero').dataset.i, m0 = save.money;
  if (act === 'ride'){ save.car = hi; writeSave(); snd('ride'); renderGarage(); fxGot(hi, false); }
  else if (act === 'buy'){ const c = CARS[hi]; if (save.owned[hi] || save.money < c.price) return; save.money -= c.price; save.owned[hi] = true; save.car = hi; writeSave(); snd('buy'); toast(`${c.name}を買った`); renderGarage(); fxGot(hi, true); fxCount($('gMoney'), save.money, m0); }
  else if (act === 'short'){ snd('denied'); toast(`あと ${fmt(CARS[hi].price - save.money)} コイン`); fxRestart(a, 'fxshake'); }
  else if (act === 'need'){ snd('denied'); toast(`称号「${titleName(CARS[hi].need)}」で解禁`); fxRestart(a, 'fxshake'); }
  else if (act === 'pt-buy'){   // one more point for this car
    const ci = save.car, n = save.pts[ci] || 0, price = ptPrice(n, ci);
    if (price === null) return;
    if (save.money < price){ snd('denied'); toast(`あと ${fmt(price - save.money)} コイン`); fxRestart(a, 'fxshake'); return; }
    save.money -= price; save.pts[ci] = n + 1; writeSave(); snd('ptBuy'); renderGarage();
    if (!RM()){ fxRestart($('gPanel').querySelectorAll('.pts i')[n], 'fxpop'); bayFx('lift'); fxCount($('gMoney'), save.money, m0); }
  }
  else if (act === 'st-add' || act === 'st-sub'){   // move one point into or out of a stat
    const ci = save.car, U = save.up[ci], k = a.dataset.k, lv = U[k] || 0, add = act === 'st-add';
    if (add ? (lv >= STAT_MAX || ptUsed(ci) >= (save.pts[ci] || 0)) : lv <= 0) return;
    U[k] = lv + (add ? 1 : -1); writeSave(); snd(!add ? 'unbolt' : U[k] >= STAT_MAX ? 'statMax' : 'ratchet'); renderGarage();
    const row = $('gPanel').querySelector(`.up[data-k="${k}"]`);
    if (!RM() && row){ fxRestart(row, add && U[k] >= STAT_MAX ? 'fxbuy' : 'fxpick'); if (add) fxRestart(row.querySelectorAll('.pips i.on')[lv], 'fxpop'); bayFx('rattle');
      fxRestart($('gPanel').querySelectorAll('.stats li')[{eng:0, body:1, boost:2, ram:3}[k]], 'fxpick'); }
  }
  else if (act === 'respec'){   // all points back to the pool (free)
    const ci = save.car; if (!ptUsed(ci)) return;
    for (const it of UPGRADES) save.up[ci][it.key] = 0; writeSave(); snd('respec'); renderGarage();
    if (!RM()){ bayFx('rattle'); tilesIn($('gPanel'), '.pts i'); }
  }
});
$('townPrev').addEventListener('click', () => { if (garageFresh()) return; save.town = (save.town + TOWNS.length - 1) % TOWNS.length; writeSave(); snd('tap'); renderTown(); if (gTab === 'mis'){ renderPanel(); fxIn($('gPanel'), -1); } fxIn($('town').children[1], -1, true); });
$('townNext').addEventListener('click', () => { if (garageFresh()) return; save.town = (save.town + 1) % TOWNS.length; writeSave(); snd('tap'); renderTown(); if (gTab === 'mis'){ renderPanel(); fxIn($('gPanel'), 1); } fxIn($('town').children[1], 1, true); });

  if (garageFresh()) return;
  if (!townOpen(save.town)){ snd('denied'); toast(`${TOWNS[save.town - 1].name}をにげきると開く`); fxRestart($('go'), 'fxshake'); return; }
  snd('tap'); startRun(); fxGo();
});
$('openSet').addEventListener('click', () => { if (garageFresh()) return; snd('tap'); syncSw(); $('wipe').hidden = false; $('wipeAsk').hidden = true; openOv('setOv'); });
$('closeSet').addEventListener('click', () => { snd('tap'); closeOv('setOv'); });
$('swSe').addEventListener('click', e => { setSound('se', !save.se); fxRestart(e.currentTarget, 'fxpick'); });
$('pSe').addEventListener('click', e => { setSound('se', !save.se); fxRestart(e.currentTarget, 'fxpick'); });
$('swBgm').addEventListener('click', e => { setSound('bgm', !save.bgm); fxRestart(e.currentTarget, 'fxpick'); });
$('pBgm').addEventListener('click', e => { setSound('bgm', !save.bgm); fxRestart(e.currentTarget, 'fxpick'); });
$('wipe').addEventListener('click', () => { snd('tap'); $('wipe').hidden = true; $('wipeAsk').hidden = false; fxRestart($('wipeAsk'), 'fxpop'); });
$('wipeNo').addEventListener('click', () => { snd('tap'); $('wipe').hidden = false; $('wipeAsk').hidden = true; fxRestart($('wipe'), 'fxpop'); });
$('wipeYes').addEventListener('click', () => {
  const se = save.se, bgm = save.bgm, tut = save.tutDone; save = freshSave(); save.se = se; save.bgm = bgm; save.tutDone = tut; writeSave();  // sound settings and the seen how-to cards stay
  $('wipe').hidden = false; $('wipeAsk').hidden = true; closeOv('setOv'); gTab = 'car'; gSel = 0; renderGarage(); toast('データを消した'); fxHero(1, true); tilesIn($('gPanel'), '.tile');
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ pauseGame(); sndDo(R => R.suspend()); } else { sndDo(R => R.resume()); if (state === 'garage') renderGarage(); } });
window.addEventListener('pagehide', () => pauseGame());
const unlockAudio = () => sndDo(R => { R.unlock(); if (!audioOn){ audioOn = true; R.setSe(save.se); R.setBgm(save.bgm); if (curSong) R.music(curSong); } });
window.addEventListener('pointerdown', unlockAudio, true); window.addEventListener('touchend', unlockAudio, true); window.addEventListener('keydown', unlockAudio, true);

/* ---------- loop & boot ---------- */
let last = 0, rafPrev = 0, rafEma = 16.7;
function frame(ts){
  /* 120 Hz screens (iPad Pro, new iPhone Pro): play at ~60 fps, half the work. 60 / 90 Hz screens are untouched. */
  const gap = ts - rafPrev; rafPrev = ts; if (gap > 0 && gap < 40) rafEma += (gap - rafEma) * 0.05;
  if (last && rafEma < 10 && ts - last < 12.5 && (state === 'play' || state === 'ending')){ requestAnimationFrame(frame); return; }
  const dt = last ? Math.min(0.033, (ts - last) / 1000) : 0.016; last = ts;
  let gdt = dt;
  if (state !== 'play' && state !== 'ending'){ hitStopT = slowMoT = 0; }
  else if (hitStopT > 0){ hitStopT -= dt; gdt = 0; } else if (slowMoT > 0){ slowMoT -= dt; gdt = dt * 0.3; }
  if (slowCool > 0) slowCool -= dt;
  // the close-up rises during the hit-stop, holds, and is back to normal by the end of the slow motion, so nothing slides when full speed returns (11/17)
  zoomK += ((hitStopT > 0 ? 1 : slowMoT > 0 ? Math.min(1, slowMoT / 0.2) : 0) - zoomK) * Math.min(1, dt * 16);
  if (state === 'play' || state === 'ending'){ if (gdt > 0) update(gdt); draw(); if (state === 'play'){ hud(dt); tickHint(dt); sndDo(R => R.engine(Math.min(1.6, -P.vy / 150), boosting)); } }
  requestAnimationFrame(frame);
}
/* local test hook (only when the file is opened from disk, never on the published page): an autopilot that dodges traffic, for balance runs */
if (location.protocol === 'file:') window.__butto = {
  get: () => ({x:P ? Math.round(P.x) : 0, camping, state, dist:Math.round(dist), townI, star, boss:!!boss, money:save.money, coins:runCoins(), hp:P && Math.round(P.hp), endKind, t:Math.round(t)}),
  save: () => save, load: o => { useSave(o); writeSave(); },
  start: i => { save.town = i; startRun(); }, garage: () => openGarage(), pause: () => pauseGame(),
  sim(sec, opt){
    opt = opt || {}; const dt = 1/60, stopAt = t + sec; let lastRes = null;
    while ((state === 'play' || state === 'ending') && t < stopAt){
      if (state === 'play'){
        const half = halfAt(dist), lim = half - P.w/2 - 2; let best = P.x, bs = -1e9;
        for (let x = -lim; x <= lim; x += 8){
          let free = 420;
          for (const c of cars){ const ahead = P.y - c.y; if (ahead < -10 || ahead > 420) continue; if (c.role === 'chaser' && c.state === 'drive' && !c.boss) continue;
            if (Math.abs(c.x - x) < (c.w + P.w)/2 + 6) free = Math.min(free, ahead - (c.opp ? 120 : 0)); }
          for (const sp of spikes){ const ahead = P.y - sp.y; if (ahead > 0 && ahead < 300 && Math.abs(sp.x - x) < sp.w/2 + P.w/2 + 4) free = Math.min(free, ahead); }
          for (const w of works){ const ahead = P.y - w.y1; if (ahead < w.y0 - w.y1 - 10 || ahead > 420) continue; if (x + P.w/2 + 4 > w.x0 && x - P.w/2 - 4 < w.x1) free = Math.min(free, Math.max(0, ahead)); }
          for (const p of ice){ const ahead = P.y - p.y; if (ahead > -p.h/2 && ahead < 200 && Math.abs(p.x - x) < p.w/2 + 4) free -= 60; }
          const sc = free - Math.abs(x - P.x) * 0.25 + (opt.wild ? Math.random() * 40 : 0);
          if (sc > bs){ bs = sc; best = x; }
        }
        targetX = best;
        if (boost >= 100 && (boss || cars.some(c => c.role === 'chaser' && c.state === 'drive' && Math.abs(c.y - P.y) < 160))) tryBoost();
      }
      update(dt);
    }
    return {dmg:Object.fromEntries(Object.entries(dmgBy).map(([k, v]) => [k, Math.round(v)])), town:townI, end:endKind || state, dist:Math.round(dist), score:runScore(), take:takeN, boss:bossN, traf:trafN, near:nearN, time:Math.round(t), star:maxStar, ko:Object.assign({}, ko), ice:iceN, hp:Math.round(P.hp)};
  }
};
function boot(data){
  loadSave();
  if (data && data.save && typeof data.save === 'object') useSave(data.save);
  setTown(townOpen(save.town) ? save.town : 0); syncSw();
  sndDo(R => { R.setSe(save.se); R.setBgm(save.bgm); });
  resize(); resetWorld(); draw();
  if (document.fonts && document.fonts.load) document.fonts.load('400 16px "Dela Gothic One"').then(() => { if (state !== 'play' && state !== 'ending') draw(); }).catch(() => {});
  requestAnimationFrame(frame);
  showTitle();
}
try { const hk = window.claude && window.claude.hot; if (hk && typeof hk.snapshot === 'function') hk.snapshot(() => ({save})); } catch(e){}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
